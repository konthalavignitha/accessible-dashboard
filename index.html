<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Shopping Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Accessible Dashboard</h1>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#data">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <div class="layout">
    <aside aria-label="Sidebar">
      <h2>Menu</h2>
      <a href="#home">Dashboard Home</a>
    </aside>

    <main id="home">
      <h2>Product Dashboard</h2>

      <div id="errorBanner" role="alert" hidden></div>

      <p id="loading" aria-live="polite" hidden>
        Loading products...
      </p>

      <section aria-label="Product search and filters">
        <label for="searchInput">Search products</label>
        <input
          id="searchInput"
          type="search"
          placeholder="Search products"
        >

        <h3>Categories</h3>
        <div id="categoryTabs" class="category-tabs"></div>

        <label for="sortSelect">Sort products</label>
        <select id="sortSelect">
          <option value="default">Default order</option>
          <option value="priceLow">Price: Low to High</option>
          <option value="priceHigh">Price: High to Low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </section>

      <section aria-label="Shopping cart">
        <button id="viewCart" type="button">
          View Cart (<span id="cartCount">0</span>)
        </button>
        <div id="cartPanel" hidden></div>
      </section>

      <section id="data" aria-label="Products">
        <div id="productList" class="product-grid"></div>
      </section>
    </main>
  </div>

  <footer id="contact">
    <p>Accessible Dashboard Project</p>
  </footer>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
