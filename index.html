
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Shopping Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to products</a>

  <header class="header">
    <h1>ShopZone</h1>
    <button id="themeToggle" type="button">🌙 Dark Mode</button>
    <button id="viewCart" type="button">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <main id="main">
    <section class="intro">
      <h2>Welcome to ShopZone</h2>
      <p>Find products, compare prices, and shop with ease.</p>
    </section>

    <section class="controls" aria-label="Product controls">
      <label for="searchInput">Search products</label>
      <input id="searchInput" type="search"
             placeholder="Search by product name">

      <label for="categorySelect">Category</label>
      <select id="categorySelect">
        <option value="All">All categories</option>
      </select>

      <label for="sortSelect">Sort products</label>
      <select id="sortSelect">
        <option value="default">Featured</option>
        <option value="priceLow">Price: Low to High</option>
        <option value="priceHigh">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </section>

    <p id="status" role="status" aria-live="polite">
      Loading products...
    </p>

    <div id="productList" class="product-grid"></div>

    <section id="cartPanel" hidden>
      <div class="section-heading">
        <h2>Your Shopping Cart</h2>
        <button id="closeCart" type="button">Close</button>
      </div>
      <div id="cartItems"></div>
      <p>Subtotal: <strong id="cartTotal">$0.00</strong></p>
      <button id="clearCart" type="button">Clear Cart</button>
      <p>Demo only. No real purchases are made.</p>
    </section>
  </main>

  <footer>
    <p>Accessible Shopping Dashboard | Learning Project</p>
  </footer>
</body>
</html>
